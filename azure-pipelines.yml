
name: $(Date:yyyyMMdd)$(Rev:.r)

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build_Job
    pool:
      vmImage: 'windows-latest'
    variables:
      solution: '**/*.sln'
      buildPlatform: 'Any CPU'
      buildConfiguration: 'Release'
      #dotnetVersion: '4.7.2'

    steps:
    # Verify .NET Framework version (optional diagnostic)
    - powershell: |
        Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full\' |
        ForEach-Object { Get-ItemProperty $_.PSPath } |
        Select-Object Version, Release |
        Format-List
      displayName: 'Check .NET Framework Version'

    # NuGet setup
    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet'

    # Dependency restoration
    - task: NuGetCommand@2
      displayName: 'Restore Packages'
      inputs:
        restoreSolution: '$(solution)'

    # Build solution
    - task: VSBuild@1
      displayName: 'Build Solution'
      inputs:
        solution: '$(solution)'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true'
        clean: true

    # Run tests
    - task: VSTest@2
      displayName: 'Execute Unit Tests'
      inputs:
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          **\*test*.dll
          !**\*TestAdapter.dll
          !**\obj\**
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    # Publish artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'