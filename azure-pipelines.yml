
name: $(Date:yyyyMMdd)$(Rev:.r)

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build_Job
    pool:
      vmImage: 'windows-latest'
    variables:
      solution: '**/*.sln'
      buildPlatform: 'Any CPU'
      buildConfiguration: 'Release'
      #dotnetVersion: '4.7.2'

    steps:
    # 1. Full repository checkout
    - checkout: self
      fetchDepth: 0
      displayName: 'Full Repository Checkout'

# 2. .NET 4.7.2 validation (existing task)
    - powershell: |
        $regPath = "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full"
        $requiredRelease = 461808
        if (-not (Test-Path $regPath)) {
            throw ".NET Framework registry key not found"
        }
        $netProps = Get-ItemProperty $regPath
        if (-not $netProps.Release) {
            throw "Release registry value missing"
        }
        if ($netProps.Release -lt $requiredRelease) {
            throw ".NET Framework 4.7.2 not installed. Detected release: $($netProps.Release)"
        }
        Write-Host "Verified .NET Framework 4.7.2 (Release $requiredRelease)"
      displayName: 'Enforce .NET 4.7.2'
      failOnStderr: true

    # 3. Update vulnerable packages
    - task: NuGetCommand@2
      displayName: 'Update Umbraco Packages'
      inputs:
        command: 'custom'
        restoreSolution: '$(solution)'

    # 4. NuGet installer (existing)
    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet'

# 5. Restore packages (existing)
    - task: NuGetCommand@2
      displayName: 'Restore Packages'
      inputs:
        restoreSolution: '$(solution)'
        feedsToUse: 'select'

    # Build solution
    - task: VSBuild@1
      displayName: 'Build Solution'
      inputs:
        solution: '$(solution)'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true'
        clean: true

    # Run tests
    - task: VSTest@2
      displayName: 'Execute Unit Tests'
      inputs:
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          **\*test*.dll
          !**\*TestAdapter.dll
          !**\obj\**
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    # Publish artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'